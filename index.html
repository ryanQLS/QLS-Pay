<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QLS Pay</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Inter, sans-serif;
      background:
        radial-gradient(circle at 82% 32%, rgba(255, 220, 248, 0.9), transparent 32%),
        radial-gradient(circle at 82% 82%, rgba(205, 220, 255, 0.85), transparent 32%),
        #fbfdff;
    }

    .accent {
      background: linear-gradient(90deg, #f36aa6, #b36cff, #4f7cff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .shadow-device {
      filter: drop-shadow(0 28px 32px rgba(45, 60, 100, 0.18));
    }
  </style>
</head>

<body class="min-h-screen overflow-hidden text-[#111827]">

  <main class="relative mx-auto min-h-screen max-w-[1230px] px-[68px] pt-[28px]">

    <!-- Header -->
    <header class="flex items-start gap-[88px]">
      <img src="assets/qls-logo-black.png" alt="QLS Pay" class="h-[92px] w-auto">

      <nav class="mt-[42px] flex gap-[36px] text-[13px] font-medium text-slate-900">
        <a href="#">Overview</a>
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">About</a>
      </nav>
    </header>

    <!-- Text -->
    <section class="relative z-20 mt-[88px] w-[470px]">
      <h1 class="text-[66px] font-black leading-[0.98] tracking-[-0.07em] text-[#151922]">
        Payment<br>
        solutions
      </h1>

      <h2 class="mt-[24px] text-[29px] font-black tracking-[-0.055em]">
        that <span class="accent">move business forward.</span>
      </h2>

      <p class="mt-[26px] max-w-[455px] text-[18px] font-medium leading-[1.55] tracking-[-0.04em] text-[#34445f]">
        QLS Pay connects merchants with trusted POS and payment partners to simplify transactions and help your business grow.
      </p>

      <a href="mailto:info@qlspay.com"
         class="mt-[36px] inline-flex h-[56px] w-[182px] items-center justify-center gap-[26px] rounded-[15px] bg-[#101827] text-[17px] font-bold text-white shadow-xl shadow-slate-900/20">
        Get Started
        <span class="text-[25px] font-medium">→</span>
      </a>
    </section>

    <!-- Register Screen -->
    <div class="shadow-device absolute left-[690px] top-[158px] h-[300px] w-[260px] rotate-[-7deg] rounded-[22px] bg-[#f7f9fc] p-[13px]">
      <div class="h-full rounded-[15px] border-[12px] border-[#161b25] bg-white">
        <img src="assets/qls-logo-black.png" alt="QLS Pay" class="mx-auto mt-[74px] h-[72px] w-auto">

        <div class="mx-auto mt-[28px] flex h-[42px] w-[42px] items-center justify-center rounded-full border border-slate-400 text-[22px]">
          )))
        </div>
      </div>
    </div>

    <!-- Register Base -->
    <div class="shadow-device absolute left-[650px] top-[420px] h-[120px] w-[300px] rounded-t-[18px] rounded-b-[10px] bg-gradient-to-b from-[#f7f8fb] to-[#e8ecf3]">
      <div class="absolute right-[32px] top-[58px] h-[8px] w-[132px] rounded-full bg-[#151b28]"></div>
    </div>

    <!-- Gradient Card -->
    <div class="shadow-device absolute left-[535px] top-[497px] z-30 h-[174px] w-[250px] rounded-[12px] bg-gradient-to-br from-[#ff7ca7] via-[#c846ed] to-[#477cff] p-[24px] text-white">
      <div class="flex justify-between">
        <div class="h-[28px] w-[41px] rounded-[7px] bg-white/85"></div>
        <div class="text-[28px] leading-none">)))</div>
      </div>

      <div class="mt-[36px] flex justify-between text-[15px] font-semibold tracking-[0.18em]">
        <span>1234</span>
        <span>5678</span>
        <span>9012</span>
        <span>3456</span>
      </div>

      <div class="mt-[29px] flex justify-between text-[12px] font-semibold">
        <span>QLS PAY</span>
        <span>12/28</span>
      </div>
    </div>

    <!-- Handheld POS -->
    <div class="shadow-device absolute right-[60px] top-[280px] h-[390px] w-[188px] rotate-[7deg] rounded-[26px] bg-[#f8fbff] p-[16px]">
      <div class="h-full rounded-[18px] border border-slate-200 bg-white p-[13px]">
        <div class="h-[172px] rounded-[10px] border border-slate-300">
          <img src="assets/qls-logo-black.png" alt="QLS Pay" class="mx-auto mt-[48px] h-[56px] w-auto">

          <div class="mx-auto mt-[18px] flex h-[36px] w-[36px] items-center justify-center rounded-full border border-slate-400 text-[18px]">
            )))
          </div>
        </div>

        <div class="mt-[14px] grid grid-cols-3 gap-[8px] text-[11px] font-bold">
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">1</button>
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">2</button>
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">3</button>
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">4</button>
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">5</button>
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">6</button>
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">7</button>
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">8</button>
          <button class="h-[30px] rounded-[7px] border border-slate-200 bg-white">9</button>
          <button class="h-[30px] rounded-[7px] bg-red-500 text-white">×</button>
          <button class="h-[30px] rounded-[7px] bg-yellow-300">←</button>
          <button class="h-[30px] rounded-[7px] bg-green-500 text-white">✓</button>
        </div>
      </div>
    </div>

    <!-- Partners -->
    <section class="absolute bottom-[28px] left-[68px] right-[68px]">
      <div class="flex items-center gap-[36px]">
        <div class="h-px flex-1 bg-slate-200"></div>
        <p class="text-[13px] font-bold uppercase tracking-[0.55em] text-slate-400">
          Trusted Partners
        </p>
        <div class="h-px flex-1 bg-slate-200"></div>
      </div>

      <div class="mt-[24px] flex items-center justify-center gap-[60px]">
        <img src="assets/clover-logo.png" alt="Clover" class="h-[50px] w-auto">
        <div class="h-[42px] w-px bg-slate-300"></div>
        <img src="assets/moneris-logo.png" alt="Moneris" class="h-[50px] w-auto">
      </div>
    </section>

  </main>

</body>
</html>
