<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QLS Pay</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Manrope", sans-serif;
    }

    .soft-bg {
      background:
        radial-gradient(circle at 78% 32%, rgba(250, 207, 240, 0.7), transparent 28%),
        radial-gradient(circle at 83% 80%, rgba(190, 207, 255, 0.55), transparent 32%),
        linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .text-accent {
      background: linear-gradient(90deg, #f26aa0, #c86ff2, #4f7df3);
      -webkit-background-clip: text;
      color: transparent;
    }

    .pos-shadow {
      filter: drop-shadow(0 35px 45px rgba(70, 82, 120, 0.18));
    }
  </style>
</head>

<body class="soft-bg min-h-screen overflow-x-hidden text-[#111827]">

  <header class="mx-auto flex h-28 max-w-[1440px] items-center px-12">
    <a href="#" class="mr-28">
      <img src="assets/qls-logo-black.png" alt="QLS Pay" class="h-28 w-auto">
    </a>

    <nav class="hidden items-center gap-12 text-[16px] font-medium text-slate-900 md:flex">
      <a href="#">Overview</a>
      <a href="#">Features</a>
      <a href="#">Pricing</a>
      <a href="#">About</a>
    </nav>
  </header>

  <main class="mx-auto max-w-[1440px] px-12">

    <section class="grid min-h-[690px] grid-cols-1 items-center gap-10 lg:grid-cols-[0.85fr_1.15fr]">

      <div class="pt-8">
        <h1 class="max-w-[540px] text-[84px] font-extrabold leading-[0.96] tracking-[-0.065em] text-[#151922]">
          Payment<br>
          solutions
        </h1>

        <h2 class="mt-6 text-[34px] font-extrabold leading-tight tracking-[-0.04em]">
          that <span class="text-accent">move business forward.</span>
        </h2>

        <p class="mt-8 max-w-[510px] text-[22px] leading-[1.55] tracking-[-0.03em] text-slate-600">
          QLS Pay connects merchants with trusted POS and payment partners to simplify transactions and help your business grow.
        </p>

        <a
          href="mailto:info@qlspay.com"
          class="mt-10 inline-flex items-center gap-8 rounded-[18px] bg-[#111827] px-8 py-5 text-[21px] font-semibold text-white shadow-xl shadow-slate-900/10"
        >
          Get Started
          <span class="text-3xl leading-none">→</span>
        </a>
      </div>

      <div class="relative hidden h-[650px] lg:block">

        <!-- POS Terminal -->
        <div class="pos-shadow absolute left-[120px] top-[70px] h-[350px] w-[330px] -rotate-[7deg] rounded-[28px] bg-[#f7f8fb] p-5">
          <div class="h-full rounded-[20px] border-[14px] border-[#151922] bg-white px-8 py-12">
            <img src="assets/qls-logo-black.png" alt="QLS Pay" class="mx-auto h-20 w-auto">
            <div class="mx-auto mt-16 flex h-14 w-14 items-center justify-center rounded-full border border-slate-400 text-2xl">
              ))) 
            </div>
          </div>
        </div>

        <div class="pos-shadow absolute left-[165px] top-[360px] h-[145px] w-[350px] rounded-[22px] bg-[#f2f3f6]">
          <div class="absolute right-8 top-12 h-3 w-44 rounded-full bg-[#1f2937]"></div>
        </div>

        <!-- Gradient Card -->
        <div class="pos-shadow absolute left-[20px] top-[440px] z-20 h-[190px] w-[330px] rounded-[18px] bg-gradient-to-br from-pink-400 via-fuchsia-500 to-blue-500 p-7 text-white">
          <div class="flex justify-between">
            <div class="h-9 w-12 rounded-lg bg-white/85"></div>
            <div class="text-3xl">)))</div>
          </div>

          <div class="mt-9 flex gap-5 text-[19px] tracking-[0.18em]">
            <span>1234</span>
            <span>5678</span>
            <span>9012</span>
            <span>3456</span>
          </div>

          <div class="mt-8 flex items-end justify-between text-sm tracking-widest">
            <span>QLS PAY</span>
            <span>12/28</span>
          </div>
        </div>

        <!-- Handheld POS -->
        <div class="pos-shadow absolute right-[45px] top-[175px] h-[500px] w-[235px] rotate-[7deg] rounded-[34px] bg-[#f8f9fb] p-5">
          <div class="h-full rounded-[22px] border border-slate-200 bg-white p-4">
            <div class="h-[205px] rounded-xl border border-slate-300 p-7">
              <img src="assets/qls-logo-black.png" alt="QLS Pay" class="mx-auto mt-4 h-16 w-auto">
              <div class="mx-auto mt-9 flex h-11 w-11 items-center justify-center rounded-full border border-slate-400 text-xl">
                )))
              </div>
            </div>

            <div class="mt-5 grid grid-cols-3 gap-3 text-center text-sm font-semibold">
              <button class="rounded-lg border border-slate-200 bg-white py-2">1</button>
              <button class="rounded-lg border border-slate-200 bg-white py-2">2</button>
              <button class="rounded-lg border border-slate-200 bg-white py-2">3</button>
              <button class="rounded-lg border border-slate-200 bg-white py-2">4</button>
              <button class="rounded-lg border border-slate-200 bg-white py-2">5</button>
              <button class="rounded-lg border border-slate-200 bg-white py-2">6</button>
              <button class="rounded-lg border border-slate-200 bg-white py-2">7</button>
              <button class="rounded-lg border border-slate-200 bg-white py-2">8</button>
              <button class="rounded-lg border border-slate-200 bg-white py-2">9</button>
              <button class="rounded-lg bg-red-500 py-2 text-white">×</button>
              <button class="rounded-lg bg-yellow-300 py-2">←</button>
              <button class="rounded-lg bg-green-500 py-2 text-white">✓</button>
            </div>
          </div>
        </div>

        <div class="absolute bottom-[18px] left-[165px] h-16 w-[520px] rounded-full bg-blue-300/25 blur-3xl"></div>
      </div>
    </section>

    <section class="pb-10">
      <div class="flex items-center gap-10">
        <div class="h-px flex-1 bg-slate-200"></div>
        <p class="text-sm font-semibold uppercase tracking-[0.45em] text-slate-400">
          Trusted Partners
        </p>
        <div class="h-px flex-1 bg-slate-200"></div>
      </div>

      <div class="mt-7 flex items-center justify-center gap-16">
        <img src="assets/clover-logo.png" alt="Clover" class="h-14 w-auto">
        <div class="h-12 w-px bg-slate-300"></div>
        <img src="assets/moneris-logo.png" alt="Moneris" class="h-14 w-auto">
      </div>
    </section>

  </main>

</body>
</html>
