<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QLS Pay</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
body{
    font-family: Inter,sans-serif;
}

.gradient-blob{
    background:
    radial-gradient(circle at top left,#8b5cf6 0%,transparent 35%),
    radial-gradient(circle at bottom right,#60a5fa 0%,transparent 35%);
}

.glass{
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,.65);
}
</style>

</head>
<body class="bg-[#f8f8fb] text-slate-900 overflow-x-hidden">

<div class="fixed inset-0 gradient-blob opacity-30 pointer-events-none"></div>

<nav class="relative z-20">
    <div class="max-w-7xl mx-auto px-8 h-24 flex items-center justify-between">

        <img
            src="assets/qls-logo.png"
            alt="QLS Pay"
            class="h-12 w-auto"
        >

        <a
            href="mailto:info@qlspay.com"
            class="px-6 py-3 rounded-full bg-black text-white font-semibold hover:bg-slate-800 transition"
        >
            Contact
        </a>

    </div>
</nav>

<section class="relative z-10">

    <div class="max-w-7xl mx-auto px-8">

        <div class="grid lg:grid-cols-2 gap-16 items-center min-h-[85vh]">

            <div>

                <p class="uppercase tracking-[0.25em] text-sm text-violet-600 font-semibold mb-6">
                    Payment Solutions
                </p>

                <h1 class="text-6xl md:text-8xl font-black leading-[0.92] tracking-tight">
                    Powering
                    businesses
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-500 to-blue-500">
                        with better
                        payments.
                    </span>
                </h1>

                <p class="mt-8 text-xl text-slate-500 max-w-xl leading-relaxed">
                    QLS Pay connects merchants with trusted POS and payment partners.
                </p>

                <div class="flex gap-4 mt-10">

                    <a
                        href="mailto:info@qlspay.com"
                        class="px-8 py-4 rounded-full bg-black text-white font-semibold"
                    >
                        Get Started
                    </a>

                    <a
                        href="#partners"
                        class="px-8 py-4 rounded-full border border-slate-300 font-semibold"
                    >
                        Partners
                    </a>

                </div>

                <div id="partners" class="mt-16">

                    <p class="text-xs uppercase tracking-[0.25em] text-slate-400 mb-6">
                        Trusted Partners
                    </p>

                    <div class="flex items-center gap-12">

                        <img
                            src="assets/clover-logo.png"
                            alt="Clover"
                            class="h-12 object-contain"
                        >

                        <div class="w-px h-10 bg-slate-300"></div>

                        <img
                            src="assets/moneris-logo.png"
                            alt="Moneris"
                            class="h-10 object-contain"
                        >

                    </div>

                </div>

            </div>

            <div class="relative hidden lg:flex justify-center">

                <div class="absolute w-[500px] h-[500px] bg-violet-300 rounded-full blur-[120px] opacity-30"></div>

                <div class="relative glass rounded-[40px] border border-white/70 shadow-2xl p-8 w-[500px]">

                    <div class="flex justify-between items-center mb-8">
                        <div>
                            <p class="text-slate-400 text-sm">
                                QLS Pay
                            </p>
                            <h3 class="text-2xl font-bold">
                                Merchant Solutions
                            </h3>
                        </div>

                        <div class="w-12 h-12 rounded-2xl bg-black"></div>
                    </div>

                    <div class="space-y-4">

                        <div class="h-24 rounded-3xl bg-white shadow-sm"></div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="h-36 rounded-3xl bg-white shadow-sm"></div>
                            <div class="h-36 rounded-3xl bg-white shadow-sm"></div>
                        </div>

                        <div class="h-28 rounded-3xl bg-white shadow-sm"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<footer class="border-t border-slate-200">

    <div class="max-w-7xl mx-auto px-8 py-8 flex justify-between text-sm text-slate-500">

        <p>
            © 2025 QLS Pay
        </p>

        <p>
            Clover & Moneris Partner Network
        </p>

    </div>

</footer>

</body>
</html>
