<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QLS Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-950">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-24 max-w-6xl items-center justify-between px-6">
      <img 
        src="assets/qls-logo.png" 
        alt="QLS Pay Logo" 
        class="h-12 w-auto"
      />

      <a href="mailto:info@qlspay.com" class="rounded-full border border-slate-300 px-5 py-2 text-sm font-semibold hover:bg-slate-100">
        Contact
      </a>
    </div>
  </header>

  <main>
    <section class="mx-auto grid min-h-[75vh] max-w-6xl items-center gap-12 px-6 py-20 md:grid-cols-2">
      <div>
        <p class="mb-4 text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">
          QLS Pay
        </p>

        <h1 class="text-5xl font-bold tracking-tight md:text-7xl">
          Simple POS & payment solutions.
        </h1>

        <p class="mt-6 max-w-xl text-lg text-slate-600">
          We help businesses connect with trusted payment and POS providers.
        </p>

        <div class="mt-8">
          <a href="mailto:info@qlspay.com" class="rounded-full bg-slate-950 px-7 py-4 font-semibold text-white hover:bg-slate-800">
            Get in Touch
          </a>
        </div>
      </div>

      <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
        <p class="mb-6 text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">
          Partners
        </p>

        <div class="grid gap-5">
          <div class="flex h-28 items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 p-6">
            <img 
              src="assets/clover-logo.png" 
              alt="Clover Logo" 
              class="max-h-12 max-w-[180px] object-contain"
            />
          </div>

          <div class="flex h-28 items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 p-6">
            <img 
              src="assets/moneris-logo.png" 
              alt="Moneris Logo" 
              class="max-h-12 max-w-[180px] object-contain"
            />
          </div>
        </div>
      </div>
    </section>

    <section class="border-t border-slate-200 bg-white py-20">
      <div class="mx-auto max-w-6xl px-6">
        <h2 class="max-w-3xl text-3xl font-bold tracking-tight md:text-5xl">
          Helping merchants find the right payment setup.
        </h2>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-200 bg-white py-8">
    <div class="mx-auto flex max-w-6xl justify-between px-6 text-sm text-slate-500">
      <p>© <span id="year"></span> QLS Pay</p>
      <p>Clover & Moneris partner network</p>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
