<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QLS Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Inter, sans-serif;
      background:
        linear-gradient(135deg, #ffffff 0%, #f8fbff 42%, #f3f0ff 100%);
    }

    .text-gradient {
      background: linear-gradient(90deg, #ec4899, #8b5cf6, #2563eb);
      -webkit-background-clip: text;
      color: transparent;
    }
  </style>
</head>

<body class="min-h-screen text-slate-950">

  <header class="mx-auto flex max-w-7xl items-center justify-between px-6 py-8">
    <img src="assets/qls-logo.png" alt="QLS Pay" class="h-20 w-auto">

    <a href="mailto:info@qlspay.com"
       class="rounded-xl bg-slate-950 px-6 py-3 font-semibold text-white hover:bg-slate-800">
      Contact
    </a>
  </header>

  <main>

<section class="mt-24">

  <h2 class="text-center text-sm font-bold uppercase tracking-[0.35em] text-slate-400">
    Trusted Partners
  </h2>

  <div class="mt-10 flex justify-center gap-8">

    <div class="flex h-32 w-64 items-center justify-center rounded-3xl border border-slate-200 bg-white shadow-sm">
      <img src="assets/clover-logo.png" class="max-h-12">
    </div>

    <div class="flex h-32 w-64 items-center justify-center rounded-3xl border border-slate-200 bg-white shadow-sm">
      <img src="assets/moneris-logo.png" class="max-h-12">
    </div>

  </div>

</section>

  </main>

</body>
</html>
