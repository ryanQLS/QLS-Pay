<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLS Pay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #cbd5e1;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
        }

        .partners {
            margin-top: 60px;
        }

        .partners h2 {
            margin-bottom: 20px;
        }

        .logos {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            color: #94a3b8;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<section class="hero">
    <h1>QLS Pay</h1>

    <p>
        Payment processing solutions for Canadian businesses.
        Get a free rate review and see if we can save you money.
    </p>

    <a class="btn" href="mailto:info@qlspay.ca">
        Get a Free Rate Review
    </a>

    <div class="partners">
        <h2>Our Partners</h2>

        <div class="logos">
            <div>Nuvei</div>
        </div>
    </div>
</section>

</body>
</html>
